name = "vip-media-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"
[[d1_databases]]
binding = "DB"
database_name = "vip-media"
database_id = "REPLACE_WITH_ID_FROM_wrangler_d1_create"
migrations_dir = "migrations"
[vars]
ALLOWED_ORIGIN = "http://localhost:5173"
# JWT_SECRET is a secret: `wrangler secret put JWT_SECRET` (never commit it)
